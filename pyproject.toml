[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-workflow-atlas"
version = "0.1.0"
requires-python = ">=3.11"
description = "Source-preserving atlas of community ComfyUI workflows, subgraphs and blueprints"

[tool.setuptools.packages.find]
where = ["src"]
