name: ComfyUI Workflows Factory - Source Discovery

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/gwp/discovery.py'
      - 'scripts/build_catalog.py'
      - 'config/workflow_sources.json'
      - 'config/use-cases.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/workflow-discovery.yml'

permissions:
  contents: write

concurrency:
  group: workflow-discovery-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - name: Sync locked environment
        run: uv sync --locked
      - name: Collect source references only (never execute third-party workflows)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --locked python -m gwp.discovery sync --max-repos 24 --discovery-pages 1 --inspect-limit 50
          uv run --locked python -m gwp.discovery stats
          uv run --locked python scripts/build_catalog.py
      - name: Commit metadata updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workflow_registry.json catalog/index.md catalog/by-usecase.json catalog/all-workflows.csv
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "data: sync upstream workflow source references"
          git pull --rebase origin main
          git push origin HEAD:main
