name: 出典収集と動作検証

on:
  push:
    paths-ignore:
      - 'data/workflow_registry.json'
      - 'data/workflow_registry.json.sha256'
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 動作検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: uvとPythonをセットアップ
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - name: uv.lockに基づく環境構築
        run: uv sync --locked
      - name: テストと構文の確認
        run: |
          bash -n scripts/catalog_sync.sh scripts/catalog_publish.sh
          uv run --locked python -m unittest discover -s tests -v
          uv run --locked python -m compileall -q src
          uv run --locked python scripts/validate_docs.py
          uv run --locked python -m gwp.agent_memory
          uv run --locked python -c 'import json,pathlib; [json.loads(p.read_text(encoding="utf-8")) for p in pathlib.Path(".").rglob("*.json")]'

  collect:
    name: 公開Workflowを収集
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    concurrency:
      group: workflow-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: uvとPythonをセットアップ
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - name: uv.lockに基づく環境構築
        run: uv sync --locked
      - name: 永続台帳を取得・差分収集・競合統合・push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/catalog_sync.sh
      - name: 確定済みmainを検証してスナップショット化
        run: |
          mkdir -p .cache/catalog-snapshot/data
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git show origin/main:data/workflow_registry.json > .cache/catalog-snapshot/data/workflow_registry.json
          git show origin/main:data/workflow_registry.json.sha256 > .cache/catalog-snapshot/data/workflow_registry.json.sha256
          uv run --locked python -m gwp.state verify --catalog .cache/catalog-snapshot/data/workflow_registry.json
      - name: 確定台帳から8領域の選定結果をスナップショット化
        run: |
          uv run --locked python -m gwp.evaluate --catalog .cache/catalog-snapshot/data/workflow_registry.json --output .cache/catalog-snapshot/selection.json
          uv run --locked python -c 'import hashlib,json; from pathlib import Path; root=Path(".cache/catalog-snapshot"); catalog=root/"data/workflow_registry.json"; target=root/"selection.json"; obj=json.loads(target.read_text(encoding="utf-8")); obj["catalog_sha256"]=hashlib.sha256(catalog.read_bytes()).hexdigest(); target.write_text(json.dumps(obj, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")'
          uv run --locked python -c 'import json; from pathlib import Path; x=json.loads(Path(".cache/catalog-snapshot/selection.json").read_text(encoding="utf-8")); expected=set(json.loads(Path("config/registry.json").read_text(encoding="utf-8"))["missions"]); assert set(x["assignments"]) == expected; assert all(len(v) <= 5 for v in x["assignments"].values()); print("選定領域:", len(expected), "候補:", x["candidates"], "統合後:", x["groups"])'
          uv run --locked python -c 'import hashlib,json; from pathlib import Path; root=Path(".cache/catalog-snapshot"); catalog=root/"data/workflow_registry.json"; selection=json.loads((root/"selection.json").read_text(encoding="utf-8")); assert selection["catalog_sha256"] == hashlib.sha256(catalog.read_bytes()).hexdigest(); assert selection["catalog_sha256"] == (root/"data/workflow_registry.json.sha256").read_text(encoding="utf-8").strip().split()[0]; print("選定結果と台帳のSHA-256一致")'
      - name: 復旧可能な確定済みスナップショットを保存
        uses: actions/upload-artifact@v4
        with:
          name: workflow-catalog-snapshot
          path: .cache/catalog-snapshot/
          if-no-files-found: error
          retention-days: 7
      - name: 実行ログ用の候補ファイルを一時保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-catalog-candidate
          path: .cache/candidate.json
          if-no-files-found: ignore
          retention-days: 7
