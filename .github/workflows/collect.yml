name: 出典収集と動作検証

on:
  push:
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 動作検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: uvとPythonをセットアップ
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - name: uv.lockに基づく環境構築
        run: uv sync --locked
      - name: テストと構文の確認
        run: |
          uv run --locked python -m unittest discover -s tests -v
          uv run --locked python -m compileall -q src
          uv run --locked python -c 'import json,pathlib; [json.loads(p.read_text(encoding="utf-8")) for p in pathlib.Path(".").rglob("*.json")]'

  collect:
    name: 出典の収集
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    concurrency:
      group: workflow-registry-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: uvとPythonをセットアップ
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - name: uv.lockに基づく環境構築
        run: uv sync --locked
      - name: 公開情報のみを収集
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --locked python -m gwp.discovery sync --max-repos 12 --discovery-pages 1 --inspect-limit 50
          uv run --locked python -m gwp.discovery stats
      - name: データを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workflow_registry.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "data: 公開Workflowの出典を更新"
          git pull --rebase origin main
          git push origin HEAD:main
