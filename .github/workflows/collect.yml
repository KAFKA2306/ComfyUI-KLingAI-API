name: 出典収集と動作検証

on:
  push:
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 動作検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: uvとPythonをセットアップ
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - name: uv.lockに基づく環境構築
        run: uv sync --locked
      - name: テストと構文の確認
        run: |
          bash -n scripts/catalog_sync.sh scripts/catalog_publish.sh
          uv run --locked python -m unittest discover -s tests -v
          uv run --locked python -m compileall -q src
          uv run --locked python scripts/validate_docs.py
          uv run --locked python -c 'import json,pathlib; [json.loads(p.read_text(encoding="utf-8")) for p in pathlib.Path(".").rglob("*.json")]'

  collect:
    name: 公開Workflowを収集
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    concurrency:
      group: workflow-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: uvとPythonをセットアップ
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - name: uv.lockに基づく環境構築
        run: uv sync --locked
      - name: 永続台帳を取得・差分収集・競合統合・push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/catalog_sync.sh
      - name: 実行ログ用の候補ファイルを一時保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-catalog-candidate
          path: .cache/candidate.json
          if-no-files-found: ignore
          retention-days: 7
