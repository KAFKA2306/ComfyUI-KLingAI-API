name: Validate ComfyUI Workflows Factory
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - name: Sync locked environment
        run: uv sync --locked
      - name: Unit tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src
      - name: Validate tracked JSON
        run: uv run --locked python -c 'import json,pathlib; [json.loads(p.read_text(encoding="utf-8")) for p in pathlib.Path(".").rglob("*.json")]'
