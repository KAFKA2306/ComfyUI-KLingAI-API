name: main のみを維持

on:
  create:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: main-only-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: main 以外のブランチを削除
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            if [[ -z "$branch" || "$branch" == "main" ]]; then
              continue
            fi
            echo "削除対象: $branch"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch" >/dev/null
            echo "削除完了: $branch"
          done
