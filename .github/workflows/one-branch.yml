name: mainブランチへの最終統合

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workflow-catalog
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - name: 台帳とすべてのブランチの履歴をmainに保持してから参照を削除
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -B main origin/main

          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | grep -v -E '^(main|HEAD)$' || true)
          declare -A tips=()
          for branch in "${branches[@]}"; do
            tips["$branch"]="$(git rev-parse "refs/remotes/origin/$branch")"
          done

          mkdir -p .cache/one-branch
          cp data/workflow_registry.json .cache/one-branch/before.json
          cp data/workflow_registry.json.sha256 .cache/one-branch/before.json.sha256
          uv run --locked python -m gwp.state verify --catalog .cache/one-branch/before.json
          if [[ -v tips[catalog] ]]; then
            git show "${tips[catalog]}:data/workflow_registry.json" > .cache/one-branch/catalog.json
            git show "${tips[catalog]}:data/workflow_registry.json.sha256" > .cache/one-branch/catalog.json.sha256
            uv run --locked python -m gwp.state verify --catalog .cache/one-branch/catalog.json
            uv run --locked python -m gwp.state merge --catalog .cache/one-branch/before.json --other .cache/one-branch/catalog.json --output .cache/one-branch/merged.json
            uv run --locked python -m gwp.state verify --catalog .cache/one-branch/merged.json --other .cache/one-branch/before.json
            uv run --locked python -m gwp.state verify --catalog .cache/one-branch/merged.json --other .cache/one-branch/catalog.json
            cp .cache/one-branch/merged.json data/workflow_registry.json
            cp .cache/one-branch/merged.json.sha256 data/workflow_registry.json.sha256
            git add data/workflow_registry.json data/workflow_registry.json.sha256
            if ! git diff --cached --quiet; then
              git commit -m 'data: catalogの未反映履歴をmainに統合 [skip ci]'
            fi
          fi

          for branch in "${branches[@]}"; do
            if ! git merge-base --is-ancestor "${tips[$branch]}" HEAD; then
              git merge -s ours --allow-unrelated-histories --no-ff --no-edit -m "history: $branch の変更履歴を保全 [skip ci]" "${tips[$branch]}"
            fi
            git merge-base --is-ancestor "${tips[$branch]}" HEAD
          done
          git push origin HEAD:refs/heads/main

          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          { printf '%s\n' 'refs/heads/main'; printf 'refs/heads/%s\n' "${branches[@]}"; } | sort > "$expected_file"
          git ls-remote --heads origin | awk '{print $2}' | sort > "$actual_file"
          diff -u "$expected_file" "$actual_file"
          for branch in "${branches[@]}"; do
            live_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [[ "$live_sha" != "${tips[$branch]}" ]]; then
              echo "ブランチの先端が変更されたため削除せず終了: $branch" >&2
              exit 1
            fi
          done

          for branch in "${branches[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch" --silent
            echo "削除: $branch"
          done
          remaining="$(git ls-remote --heads origin | awk '{print $2}')"
          test "$remaining" = 'refs/heads/main'
          echo '検証完了: main 1本のみ'
